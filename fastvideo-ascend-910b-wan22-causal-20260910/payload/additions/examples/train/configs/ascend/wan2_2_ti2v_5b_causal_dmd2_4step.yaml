# Wan2.2 TI2V-5B paper-style four-step Self-Forcing DMD2 on Ascend 910B.
# Initialize the student from the exported causal SFT checkpoint. This short
# 100-iteration run is intended to validate stability and quality direction
# before committing to a longer recovery run.

models:
  student:
    _target_: fastvideo.train.models.wan.WanCausalModel
    init_from: data/models/Wan2.2-TI2V-5B-Diffusers
    transformer_override_safetensor: outputs/wan22_ti2v_5b_causal_sft_export/transformer/model.safetensors
    trainable: true
    num_frames_per_block: 3
    attention_backend: TORCH_SDPA
  teacher:
    _target_: fastvideo.train.models.wan.WanModel
    init_from: data/models/Wan2.2-TI2V-5B-Diffusers
    trainable: false
    disable_custom_init_weights: true
    attention_backend: TORCH_SDPA
  critic:
    _target_: fastvideo.train.models.wan.WanModel
    init_from: data/models/Wan2.2-TI2V-5B-Diffusers
    trainable: true
    disable_custom_init_weights: true
    attention_backend: TORCH_SDPA

method:
  _target_: fastvideo.train.methods.distribution_matching.self_forcing.SelfForcingMethod
  rollout_mode: simulate
  # Four logical points on the shifted 1000-step flow schedule. These match
  # the established FastVideo/CausVid four-step schedule.
  dmd_denoising_steps: [1000, 750, 500, 250]
  warp_denoising_step: true
  # Iterations 1-4 update only the critic; iteration 5 updates only the
  # student. Keeping the graphs mutually exclusive avoids the former step-5
  # memory peak.
  generator_update_interval: 5
  real_score_guidance_scale: 3.0
  min_timestep_ratio: 0.02
  max_timestep_ratio: 0.98
  chunk_size: 3
  student_sample_type: ode
  # Paper-style stochastic gradient truncation: sample one of the four
  # denoising positions per sequence and backpropagate through that position
  # only. Previous frames and their KV cache stay detached.
  same_step_across_blocks: true
  last_step_only: false
  # Retain only the final one-latent-frame remainder block. For 13 latent
  # frames the block layout is 3+3+3+3+1, giving a deterministic memory bound
  # instead of occasionally sampling a three-frame graph that can OOM.
  gradient_block_mode: last_one
  context_noise: 0.0
  enable_gradient_in_rollout: true
  start_gradient_frame: 0
  fake_score_learning_rate: 4.0e-7
  fake_score_betas: [0.0, 0.999]
  fake_score_lr_scheduler: constant

training:
  distributed:
    num_gpus: 8
    sp_size: 1
    tp_size: 1
    hsdp_replicate_dim: 1
    hsdp_shard_dim: 8
    pin_cpu_memory: true

  data:
    data_path: data/crush-smol_processed_ti2v/combined_parquet_dataset
    preprocessed_data_type: t2v
    dataloader_num_workers: 4
    train_batch_size: 1
    training_cfg_rate: 0.0
    seed: 1000
    # Start with 49 RGB frames (13 latent frames). After this is stable, the
    # command-line overrides in the guide provide an 81-frame quality tier.
    num_latent_t: 13
    num_height: 704
    num_width: 1280
    num_frames: 49

  optimizer:
    learning_rate: 2.0e-6
    betas: [0.0, 0.999]
    weight_decay: 0.01
    lr_scheduler: constant
    lr_warmup_steps: 0

  loop:
    max_train_steps: 100
    gradient_accumulation_steps: 1

  checkpoint:
    output_dir: outputs/wan22_ti2v_5b_causal_dmd2_4step
    training_state_checkpointing_steps: 25
    checkpoints_total_limit: 4

  tracker:
    trackers: []
    project_name: fastvideo_wan22_causal
    run_name: wan22_ti2v_5b_self_forcing_dmd2_4step_ascend

  model:
    enable_gradient_checkpointing_type: full

  dit_precision: bf16

callbacks:
  grad_clip:
    _target_: fastvideo.train.callbacks.grad_clip.GradNormClipCallback
    max_grad_norm: 1.0

pipeline:
  flow_shift: 5.0
  is_causal: true
  dmd_denoising_steps: [1000, 750, 500, 250]
  warp_denoising_step: true
