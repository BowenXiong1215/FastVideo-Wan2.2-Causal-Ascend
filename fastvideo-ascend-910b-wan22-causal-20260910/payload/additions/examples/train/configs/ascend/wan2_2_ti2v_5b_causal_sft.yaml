# Wan2.2 TI2V-5B -> block-causal SFT on 8 Ascend 910B NPUs.
# Override local paths on the command line when needed:
#   --models.student.init_from /models/Wan2.2-TI2V-5B-Diffusers
#   --training.data.data_path /data/wan22_processed/combined_parquet_dataset

models:
  student:
    _target_: fastvideo.train.models.wan.WanCausalModel
    init_from: data/models/Wan2.2-TI2V-5B-Diffusers
    trainable: true
    num_frames_per_block: 3
    attention_backend: TORCH_SDPA

method:
  _target_: fastvideo.train.methods.fine_tuning.dfsft.DiffusionForcingSFTMethod
  chunk_size: 3
  min_timestep_ratio: 0.02
  max_timestep_ratio: 0.98

training:
  distributed:
    num_gpus: 8
    sp_size: 1
    tp_size: 1
    hsdp_replicate_dim: 1
    hsdp_shard_dim: 8
    pin_cpu_memory: true

  data:
    data_path: data/crush-smol_processed_ti2v/combined_parquet_dataset
    preprocessed_data_type: t2v
    dataloader_num_workers: 4
    train_batch_size: 1
    training_cfg_rate: 0.0
    seed: 1000
    num_latent_t: 31
    num_height: 704
    num_width: 1280
    num_frames: 121

  optimizer:
    learning_rate: 2.0e-6
    betas: [0.9, 0.999]
    weight_decay: 0.01
    lr_scheduler: constant
    lr_warmup_steps: 0

  loop:
    max_train_steps: 4000
    gradient_accumulation_steps: 1

  checkpoint:
    output_dir: outputs/wan22_ti2v_5b_causal_sft
    training_state_checkpointing_steps: 500
    checkpoints_total_limit: 3

  tracker:
    trackers: []
    project_name: fastvideo_wan22_causal
    run_name: wan22_ti2v_5b_causal_sft_ascend

  model:
    enable_gradient_checkpointing_type: full

  dit_precision: bf16

callbacks:
  grad_clip:
    _target_: fastvideo.train.callbacks.grad_clip.GradNormClipCallback
    max_grad_norm: 1.0

pipeline:
  flow_shift: 5.0
  is_causal: true
