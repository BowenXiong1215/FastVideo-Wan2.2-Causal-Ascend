# Wan2.2 TI2V-5B block-causal quality recovery with Self-Forcing DMD2.
# Run after exporting the causal SFT student to
# outputs/wan22_ti2v_5b_causal_sft_export.

models:
  student:
    _target_: fastvideo.train.models.wan.WanCausalModel
    init_from: data/models/Wan2.2-TI2V-5B-Diffusers
    transformer_override_safetensor: outputs/wan22_ti2v_5b_causal_sft_export/transformer/model.safetensors
    trainable: true
    num_frames_per_block: 3
    attention_backend: TORCH_SDPA
  teacher:
    _target_: fastvideo.train.models.wan.WanModel
    init_from: data/models/Wan2.2-TI2V-5B-Diffusers
    trainable: false
    disable_custom_init_weights: true
    attention_backend: TORCH_SDPA
  critic:
    _target_: fastvideo.train.models.wan.WanModel
    init_from: data/models/Wan2.2-TI2V-5B-Diffusers
    trainable: true
    disable_custom_init_weights: true
    attention_backend: TORCH_SDPA

method:
  _target_: fastvideo.train.methods.distribution_matching.self_forcing.SelfForcingMethod
  rollout_mode: simulate
  # Preserve a 50-step rollout. DMD2 is used for on-policy distribution
  # recovery, not few-step distillation. With warp enabled these logical
  # indices select every twentieth point from the shifted 1000-step grid.
  dmd_denoising_steps: [1000, 980, 960, 940, 920, 900, 880, 860, 840, 820, 800, 780, 760, 740, 720, 700, 680, 660, 640, 620, 600, 580, 560, 540, 520, 500, 480, 460, 440, 420, 400, 380, 360, 340, 320, 300, 280, 260, 240, 220, 200, 180, 160, 140, 120, 100, 80, 60, 40, 20]
  warp_denoising_step: true
  generator_update_interval: 5
  real_score_guidance_scale: 3.0
  min_timestep_ratio: 0.02
  max_timestep_ratio: 0.98
  chunk_size: 3
  student_sample_type: ode
  same_step_across_blocks: true
  # Randomly cover positions across the complete 50-point schedule during
  # training. This changes objective coverage, not deployment step count.
  last_step_only: false
  context_noise: 0.0
  enable_gradient_in_rollout: true
  start_gradient_frame: 0
  fake_score_learning_rate: 4.0e-7
  fake_score_betas: [0.0, 0.999]
  fake_score_lr_scheduler: constant

training:
  distributed:
    num_gpus: 8
    sp_size: 1
    tp_size: 1
    hsdp_replicate_dim: 1
    hsdp_shard_dim: 8
    pin_cpu_memory: true

  data:
    data_path: data/crush-smol_processed_ti2v/combined_parquet_dataset
    preprocessed_data_type: t2v
    dataloader_num_workers: 4
    train_batch_size: 1
    training_cfg_rate: 0.0
    seed: 1000
    num_latent_t: 31
    num_height: 704
    num_width: 1280
    num_frames: 121

  optimizer:
    learning_rate: 2.0e-6
    betas: [0.0, 0.999]
    weight_decay: 0.01
    lr_scheduler: constant
    lr_warmup_steps: 0

  loop:
    max_train_steps: 1000
    gradient_accumulation_steps: 1

  checkpoint:
    output_dir: outputs/wan22_ti2v_5b_causal_dmd2_quality
    training_state_checkpointing_steps: 100
    checkpoints_total_limit: 3

  tracker:
    trackers: []
    project_name: fastvideo_wan22_causal
    run_name: wan22_ti2v_5b_self_forcing_dmd2_quality_ascend

  model:
    enable_gradient_checkpointing_type: full

  dit_precision: bf16

callbacks:
  grad_clip:
    _target_: fastvideo.train.callbacks.grad_clip.GradNormClipCallback
    max_grad_norm: 1.0

pipeline:
  flow_shift: 5.0
  is_causal: true
  dmd_denoising_steps: [1000, 980, 960, 940, 920, 900, 880, 860, 840, 820, 800, 780, 760, 740, 720, 700, 680, 660, 640, 620, 600, 580, 560, 540, 520, 500, 480, 460, 440, 420, 400, 380, 360, 340, 320, 300, 280, 260, 240, 220, 200, 180, 160, 140, 120, 100, 80, 60, 40, 20]
  warp_denoising_step: true
